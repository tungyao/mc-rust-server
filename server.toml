bind = "0.0.0.0:25565"
motd = "Rust MC 26.3 (777) self-made"
max_players = 100
view_distance = 10
seed = 123456789
compression_threshold = -1
# 世界存储后端："redb"（默认，world/state-<seed>.redb）或 "legacy"（旧 overrides/player .dat）
world_storage = "redb"
# 生成器版本：1=legacy（冻结默认，老 seed 必须保持），2=仅新 seed/显式启用
generator_version = 1
# socket 归属："ecs"（默认，全量 ECS I/O）或 "net"（紧急回退）
socket_mode = "ecs"
# 唯一可配的玩法项：A3 BlockUpdate 合并（改包序，待真机双开确认后再开，默认关）。
# 其余基本玩法（工作台 GUI/XP/饥饿/设置持久/统计/journal/天气状态/工作台落盘）
# 已全部写死常开，不再是配置。
broadcast_throttle = false
